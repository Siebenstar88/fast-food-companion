<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Food Simulator Companion</title>
    <!-- PWA / Vollbild Meta-Tags -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f172a">
    <link rel="manifest" href="manifest.json">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans select-none">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50 shadow-md">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wider text-amber-400">🍔 Fast Food Companion</h1>
            <span class="text-xs bg-slate-700 px-2 py-1 rounded text-slate-300">PWA Aktiv</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto p-4 flex-grow w-full pb-20">
        
        <!-- Sektion: Lagerbestand Tracker -->
        <section class="bg-slate-800 rounded-xl p-4 shadow-lg border border-slate-700 mb-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold text-amber-300">📦 Lagerbestand Tracker</h2>
                <button onclick="resetInventory()" class="text-xs bg-rose-600 hover:bg-rose-700 text-white px-3 py-1.5 rounded transition">Zurücksetzen</button>
            </div>
            
            <p class="text-xs text-slate-400 mb-4">Tippe auf + oder –, um den Bestand für deine Schicht anzupassen. Werte werden automatisch gespeichert.</p>

            <!-- Grid für die Materialien -->
            <div id="inventory-grid" class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <!-- Dynamisch generiert via JavaScript -->
            </div>
        </section>

    </main>

    <!-- Footer / Navigation -->
    <footer class="bg-slate-800 border-t border-slate-700 text-center py-3 text-xs text-slate-400 fixed bottom-0 left-0 right-0">
        Fast Food Simulator Companion App &bull; Optimiert für Android Tablet
    </div></footer>

    <!-- JavaScript Logik -->
    <script>
        // Liste aller Materialien
        const items = [
            "Burger-Einschlagpapier",
            "Gefrorene Rindefleisch-Patty",
            "Burger-Brötchen",
            "Müllbeutel",
            "Ketchup",
            "Mr. Hoop",
            "Youma Berry",
            "Youma",
            "Light Splash Cola",
            "Splash Cola",
            "Salat",
            "Mayonnaise",
            "Gewürzgurken",
            "Eisbecher",
            "Zwiebeln",
            "Tomaten",
            "Papiertüten",
            "Frittieröl",
            "Pommesbecher (Klein)",
            "Pommesbecher (Mittel)",
            "Pommesbecher (Groß)",
            "Gefrorene Pommes",
            "Senf",
            "Gefrorene Hähnchen-Patty",
            "Kaffee",
            "Kaffeebecher",
            "Milch",
            "Cheddar-Käse",
            "Nugget-Boxen",
            "Gefrorene Chicken Nugget"
        ];

        // Speicher laden oder initialisieren
        function getInventoryData() {
            const data = localStorage.getItem('ffs_inventory');
            return data ? JSON.parse(data) : {};
        }

        function saveInventoryData(data) {
            localStorage.setItem('ffs_inventory', JSON.stringify(data));
        }

        // UI rendern
        function renderInventory() {
            const grid = document.getElementById('inventory-grid');
            const data = getInventoryData();
            grid.innerHTML = '';

            items.forEach((item, index) => {
                const count = data[item] !== undefined ? data[item] : 0;

                const card = document.createElement('div');
                card.className = "bg-slate-700/50 border border-slate-600/60 p-3 rounded-lg flex items-center justify-between shadow-sm";

                card.innerHTML = `
                    <span class="text-sm font-medium text-slate-200 pr-2">${item}</span>
                    <div class="flex items-center space-x-2">
                        <button onclick="updateCount('${item}', -1)" class="w-9 h-9 bg-slate-600 hover:bg-slate-500 text-white font-bold rounded-lg flex items-center justify-center text-lg active:scale-95 transition">-</button>
                        <span id="count-${index}" class="w-10 text-center font-semibold text-amber-400">${count}</span>
                        <button onclick="updateCount('${item}', 1)" class="w-9 h-9 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-lg flex items-center justify-center text-lg active:scale-95 transition">+</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Anzahl ändern
        function updateCount(item, change) {
            const data = getInventoryData();
            let current = data[item] !== undefined ? data[item] : 0;
            current += change;
            if (current < 0) current = 0; // Nicht unter 0 fallen
            data[item] = current;
            saveInventoryData(data);
            renderInventory();
        }

        // Alles auf 0 zurücksetzen
        function resetInventory() {
            if (confirm("Möchtest du den gesamten Lagerbestand wirklich zurücksetzen?")) {
                localStorage.removeItem('ffs_inventory');
                renderInventory();
            }
        }

        // Beim Start ausführen
        window.onload = renderInventory;
    </script>
</body>
</html>
